<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" href="/logo/newlogopetit.png" />
    <!-- LCP: discover hero image before JS/CSS so mobile can fetch 400/800w AVIF early -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/images/exterior-400.avif 400w, /images/exterior-800.avif 800w, /images/exterior-1600.avif 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/font/Cabin.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>Cal Masses</title>
    <meta name="description" content="Cal Masses" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
